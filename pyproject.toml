[project]
name = "pdfrenamer"
version = "0.0.0"
description = "Rough tool to try and rename bills and invoices"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSES/*"]
authors = [{ name = "Diego Elio Pettenò", email = "flameeyes@flameeyes.com" }]
keywords = ["pdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "click",
    "click-log",
    "dateparser",
    "pdfminer.six == 20260107",
    "more-itertools",
]

[project.urls]
Homepage = "https://github.com/Flameeyes/pdfrenamer"

[project.scripts]
pdfrename = "pdfrename.pdfrename:main"

[dependency-groups]
dev = [
    "pytest-mypy",
    "mypy",
    "types-dateparser",
    "pre-commit",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pdfrename"
module-root = ""

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Pyflakes, pycodestyle, and isort, replacing flake8 and isort.
select = ["E", "F", "W", "I"]
# E501: long lines are handled by the formatter.
ignore = ["E501"]
